<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booknook · Library Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>Booknook</h1>
          <p>Library Dashboard</p>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-view="dashboard">Dashboard</button>
        <button class="nav-btn" data-view="books">Books</button>
        <button class="nav-btn" data-view="members">Members</button>
        <button class="nav-btn" data-view="loans">Loans</button>
      </nav>
      <p class="sidebar-foot">“A room without books is like a body without a soul.”</p>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h2 id="view-title">Dashboard</h2>
          <p id="view-sub" class="muted"></p>
        </div>
        <div class="top-actions">
          <input id="search" class="search" type="search" placeholder="Search…" />
          <button id="add-btn" class="btn primary">+ Add</button>
        </div>
      </header>

      <!-- Dashboard -->
      <section id="view-dashboard" class="view">
        <div class="stats" id="stats"></div>
        <div class="grid-2">
          <div class="card">
            <h3>Books by genre</h3>
            <div id="genre-chart" class="bars"></div>
          </div>
          <div class="card">
            <h3>Recent activity</h3>
            <ul id="recent" class="recent"></ul>
          </div>
        </div>
      </section>

      <!-- Books -->
      <section id="view-books" class="view hidden">
        <div class="card table-card">
          <table>
            <thead><tr><th>Title</th><th>Author</th><th>Genre</th><th>Year</th><th>Available</th><th></th></tr></thead>
            <tbody id="books-body"></tbody>
          </table>
        </div>
      </section>

      <!-- Members -->
      <section id="view-members" class="view hidden">
        <div class="card table-card">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Books out</th><th></th></tr></thead>
            <tbody id="members-body"></tbody>
          </table>
        </div>
      </section>

      <!-- Loans -->
      <section id="view-loans" class="view hidden">
        <div class="card table-card">
          <table>
            <thead><tr><th>Book</th><th>Member</th><th>Borrowed</th><th>Due</th><th>Status</th><th></th></tr></thead>
            <tbody id="loans-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <form id="modal-form"></form>
      <p id="modal-error" class="error hidden"></p>
      <div class="modal-actions">
        <button type="button" id="modal-cancel" class="btn ghost">Cancel</button>
        <button type="submit" form="modal-form" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
